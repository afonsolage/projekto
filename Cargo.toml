[package]
name = "projekto"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# wgsl-analyzer can't load Cargo packages yet, so Bevy's shaders come from a local
# clone of the matching Bevy tag, linked (and ignored) as `.bevy`:
#   git clone --depth 1 --branch v0.20.0 https://github.com/bevyengine/bevy ~/ref/bevy-0.20
#   ln -s ~/ref/bevy-0.20 .bevy
[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "assets/shaders"

[package.metadata.wgsl-analyzer.dependencies]
bevy_pbr = { path = ".bevy/crates/bevy_pbr" }

[workspace]
members = ["crates/*"]
default-members = ["crates/client"]

[workspace.dependencies]
projekto_core = { path = "crates/core",features = ["auto_load_kinds_descs"]  }
projekto_camera = { path = "crates/camera" }
projekto_proto = { path = "crates/proto" }
projekto_messages = { path = "crates/messages" }
projekto_server = { path = "crates/server" }
projekto_client = { path = "crates/client" }
projekto_archive = { path = "crates/archive" }
projekto_diagnostics = { path = "crates/diagnostics" }

bevy = { version = "0.20", default-features = false, features = ["3d", "bevy_ui_render"]}

# Diagnostics
memory-stats = "1.2"

rand = "0.10"
thiserror = "2.0"
serde = "1.0"
criterion = { version = "0.7", features = ["async_futures"]}

# IO
lz4_flex = "0.11"
# bincode 2 changed a lot, don't know if it's worth the upgrade
bincode = { version = "2.0", features = ["serde"] }

# smol
futures-lite = "2.2"
async-channel = "2.2"
async-net = "2.0"
async-io = "2.3"
async-lock = "3.3"
async-fs = "2.1"

[dev-dependencies]
bevy.workspace = true
projekto_camera.workspace = true
projekto_core.workspace = true
projekto_proto.workspace = true
projekto_server.workspace = true

[workspace.lints.clippy]
type_complexity = "allow"
doc_markdown = "warn"
manual_let_else = "warn"
undocumented_unsafe_blocks = "warn"
redundant_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
#TODO(rust 1.77): enable `ref_as_ptr`
# ref_as_ptr = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
# missing_docs = "warn"

[lints]
workspace = true

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "orbit_cam"
path = "examples/orbit_cam.rs"

[[example]]
name = "swap_cam"
path = "examples/swap_cam.rs"
