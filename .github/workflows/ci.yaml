name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # If nightly is breaking CI, modify this variable to target a specific nightly version.
  NIGHTLY_TOOLCHAIN: nightly-2026-08-15
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:

  # Run cargo test --workspace
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Run cargo test
        run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} test --workspace --config 'profile.dev.package."*".opt-level=1'

  # Run cargo clippy --workspace -- -D warnings
  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Run clippy
        run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} clippy --workspace -- -D warnings

  # Run cargo fmt --all -- --check
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rustfmt
      - name: Run cargo fmt
        run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} fmt --all -- --check

  check-unused-dependencies:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Installs cargo-udeps
        run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} install --locked cargo-udeps
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Run cargo udeps
        run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} udeps
